name: taxycity
description: A taxi ordering mobile application for clients and drivers.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.2
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.2.4
  flutter_local_notifications: ^17.0.0
  google_maps_flutter: ^2.5.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  share_plus: ^7.2.1
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.20
  firebase_analytics: ^10.7.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
